[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyanimalprocessing"
dynamic = ["version"]
authors = [
    {name = "Boris Guirao"},
    {name = "Adrien Leroy"},
    {name = "Stéphane Rigaud"},
    {name = "Mehdi Ech-Chouini"},
]
description = "MATLAB and Python suite for quantitative analysis of epithelial tissue dynamics from live imaging. MATLAB code implements the multiscale tissue mechanics formalism (Guirao et al., eLife 2015). Python package provides napari-based visualization and zarr-based data processing."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.25,<2",
    "napari[all]==0.5.6",
    "zarr>=2.16.0,<3",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pandas>=2.0",
    "dask>=2023.1",
    "qtpy>=2.3",
    "imageio>=2.30",
    "imageio-ffmpeg>=0.6.0",
    "scipy>=1.10",
    "scikit-image>=0.20",
    "libpysal>=4.7",
    "esda>=2.5",
    "pyyaml>=6.0",
    "tqdm>=4.60",
    "cairosvg>=2.7",
    "rasterio>=1.3",
    "shapely>=2.0",
    "natsort>=8",
]

[project.urls]
Homepage = "https://github.com/BellaicheLab/AnimalProcessing"
"Bug Tracker" = "https://github.com/BellaicheLab/AnimalProcessing/issues"
"Reference" = "https://doi.org/10.7554/eLife.08519"

[project.scripts]
zarrify_SAP = "pyanimalprocessing.scripts.zarrify:zarrify_SAP"
zarrify_MAP = "pyanimalprocessing.scripts.zarrify:zarrify_MAP"

[project.optional-dependencies]
docs = [
    "sphinx>=7.0,<9",
    "pydata-sphinx-theme>=0.15",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.5",
    "nbsphinx>=0.9",
    "ipython>=8.0",
]
testing = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "pyanimalprocessing.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyanimalprocessing*"]

[tool.setuptools.package-data]
pyanimalprocessing = ["config/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: large-fixture / long-running tests (opt-in with -m slow)",
    "gui: needs a Qt binding; run with QT_QPA_PLATFORM=offscreen",
]